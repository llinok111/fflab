<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fflab · FFmpeg 滤镜图练习台</title>
<style>
/* 取色:灰阶 9 级打层级,强调色仅一个色相(矢车菊蓝 CornflowerBlue #6495ED)。
   状态色单列(浅绿 LightGreen #90EE90 / 猩红 Crimson #DC143C),不参与强调。 */
:root{
  --c-bg:#1A1A1A; --c-panel:#333333; --c-panel-soft:#262626;
  --c-line:#666666; --c-line-soft:#3d3d3d;
  --c-ink:#F0F0F0; --c-ink-dim:#CCCCCC; --c-ink-weak:#999999;
  --c-accent:#6495ED; --c-pass:#90EE90; --c-fail:#DC143C;
  --mono:"Cascadia Mono","Consolas","SF Mono",ui-monospace,monospace;
  --sans:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--c-bg);color:var(--c-ink);font-family:var(--sans);font-size:14px;line-height:1.6}
.shell{display:grid;grid-template-columns:280px 1fr;height:100vh;overflow:hidden}
aside{background:var(--c-panel-soft);border-right:1px solid var(--c-line-soft);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:18px 20px 14px;border-bottom:1px solid var(--c-line-soft)}
.brand h1{margin:0;font-size:15px;letter-spacing:.04em;font-weight:600}
.brand p{margin:4px 0 0;font-size:11.5px;color:var(--c-ink-weak)}
.brand .root{margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--c-ink-weak);word-break:break-all;line-height:1.4}
.steps{flex:1;overflow-y:auto;padding:10px}
.step{display:flex;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.step:hover{background:#2e2e2e}
.step.active{background:#2e2e2e;border-color:var(--c-accent)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:0 0 8px;background:var(--c-line)}
.dot.passed{background:var(--c-pass)}
.dot.attempted{background:var(--c-accent)}
.step .t{font-size:12.5px;color:var(--c-ink-dim);line-height:1.4}
.step.active .t{color:var(--c-ink)}
.step .n{font-family:var(--mono);font-size:10px;color:var(--c-ink-weak);margin-top:2px}
.side-foot{padding:12px 14px;border-top:1px solid var(--c-line-soft);display:flex;flex-direction:column;gap:7px}
button{font-family:inherit;font-size:12.5px;border-radius:5px;border:1px solid var(--c-line);
  background:#2b2b2b;color:var(--c-ink-dim);padding:7px 12px;cursor:pointer;transition:.12s}
button:hover{border-color:var(--c-ink-weak);color:var(--c-ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--c-accent);border-color:var(--c-accent);color:#12161f;font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.ghost{background:transparent}
main{overflow-y:auto;padding:26px 34px 60px}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.head h2{margin:0;font-size:19px;font-weight:600;letter-spacing:.01em}
.tag{font-family:var(--mono);font-size:10.5px;color:var(--c-ink-weak);border:1px solid var(--c-line-soft);padding:2px 7px;border-radius:3px}
.bar{height:2px;background:var(--c-line-soft);margin:14px 0 20px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--c-accent);width:0;transition:width .3s}
.why{color:var(--c-ink-dim);font-size:13px;margin:0 0 16px;padding-left:12px;border-left:2px solid var(--c-line)}
.task{background:var(--c-panel-soft);border:1px solid var(--c-line-soft);border-radius:6px;padding:13px 15px;margin-bottom:18px}
.task b{color:var(--c-accent);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.task p{margin:6px 0 0;color:var(--c-ink)}
label.fld{display:block;font-size:11px;color:var(--c-ink-weak);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
textarea{width:100%;min-height:74px;background:#141414;color:var(--c-ink);border:1px solid var(--c-line-soft);
  border-radius:6px;padding:11px 13px;font-family:var(--mono);font-size:12.5px;line-height:1.55;resize:vertical}
textarea:focus{outline:none;border-color:var(--c-accent)}
.actions{display:flex;gap:8px;margin:12px 0 22px;flex-wrap:wrap;align-items:center}
.hintbox{background:#141414;border:1px dashed var(--c-line);border-radius:6px;padding:11px 13px;
  font-family:var(--mono);font-size:12px;color:var(--c-ink-dim);white-space:pre-wrap;word-break:break-all;margin-bottom:18px}
.sec{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--c-ink-weak);margin:22px 0 9px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:500;color:var(--c-ink-weak);font-size:11px;letter-spacing:.05em;
  text-transform:uppercase;border-bottom:1px solid var(--c-line);padding:5px 10px 5px 0}
td{padding:7px 10px 7px 0;border-bottom:1px solid var(--c-line-soft);vertical-align:top;color:var(--c-ink-dim)}
td.k{color:var(--c-ink);width:38%}
.ok{color:var(--c-pass);font-family:var(--mono);font-size:11px}
.no{color:var(--c-fail);font-family:var(--mono);font-size:11px}
pre{background:#141414;border:1px solid var(--c-line-soft);border-radius:6px;padding:12px 14px;
  font-family:var(--mono);font-size:11.5px;line-height:1.55;color:var(--c-ink-dim);overflow-x:auto;
  white-space:pre-wrap;word-break:break-all;max-height:340px;overflow-y:auto;margin:0}
.verdict{border-radius:6px;padding:12px 15px;margin:18px 0;border:1px solid;font-size:13px}
.verdict.pass{border-color:#3d6b3d;background:#1d2a1d;color:var(--c-pass)}
.verdict.fail{border-color:#6b2333;background:#2a1a1e;color:#ffb3c0}
.insight{border-left:2px solid var(--c-accent);padding:8px 0 8px 13px;color:var(--c-ink-dim);font-size:12.5px;margin:16px 0 0}
.insight b{color:var(--c-accent);display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.meta{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--c-ink-weak);font-family:var(--mono)}
.meta span b{color:var(--c-ink-dim);font-weight:500}
.empty{color:var(--c-ink-weak);font-size:13px}
.done-banner{border:1px solid #3d6b3d;background:#1d2a1d;color:var(--c-pass);padding:13px 16px;border-radius:6px;margin-bottom:20px}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">
      <h1>fflab</h1>
      <p>FFmpeg 滤镜图 · 分步练习台</p>
      <div class="root" id="rootPath">—</div>
    </div>
    <div class="steps" id="stepList"></div>
    <div class="side-foot">
      <button class="ghost" id="btnReset">重置练习区</button>
      <button class="ghost" id="btnResetAll">重置并重建素材</button>
      <button class="ghost" id="btnResetProgress">只清进度记录</button>
    </div>
  </aside>
  <main id="main">
    <p class="empty">正在载入…</p>
  </main>
</div>
<script>
const S = { state:null, current:null, lastHint:null };

function esc(s){ return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function api(path, body){
  const opt = body ? {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  const j = await r.json();
  if(!r.ok || j.ok === false) throw new Error(j.error || ("HTTP "+r.status));
  return j;
}

function renderSteps(){
  const el = document.getElementById("stepList");
  el.innerHTML = S.state.steps.map(s=>{
    const cls = s.status==="passed" ? "passed" : (s.status==="attempted" ? "attempted" : "");
    const act = s.id===S.current ? " active" : "";
    return `<div class="step${act}" data-id="${s.id}">
      <div class="dot ${cls}"></div>
      <div><div class="t">${esc(s.title)}</div>
      <div class="n">${s.status==="passed"?"已完成":(s.attempts?`尝试 ${s.attempts} 次`:"未开始")}</div></div>
    </div>`;
  }).join("");
  el.querySelectorAll(".step").forEach(n=>n.onclick=()=>{ S.current=n.dataset.id; S.lastHint=null; renderSteps(); renderMain(); });
}

function renderMain(){
  const s = S.state.steps.find(x=>x.id===S.current);
  const main = document.getElementById("main");
  if(!s){ main.innerHTML = `<p class="empty">请选择左侧步骤</p>`; return; }
  const idx = S.state.steps.findIndex(x=>x.id===s.id);
  const pct = ((S.state.steps.filter(x=>x.status==="passed").length)/S.state.steps.length*100).toFixed(0);
  const done = S.state.completed ? `<div class="done-banner">全部步骤已通过。成片在 <code>workspace/work/final.mp4</code>。</div>` : "";
  main.innerHTML = `
    ${done}
    <div class="head"><h2>${esc(s.title)}</h2><span class="tag">${esc(s.id)}</span></div>
    <div class="meta">
      <span>进度 <b>${pct}%</b></span>
      <span>状态 <b>${s.status==="passed"?"已通过":(s.attempts?"已尝试":"未开始")}</b></span>
      <span>尝试 <b>${s.attempts}</b> 次</span>
      ${s.first_passed_at?`<span>首次通过 <b>${esc(s.first_passed_at)}</b></span>`:""}
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <p class="why">${esc(s.why)}</p>
    <div class="task"><b>任务</b><p>${esc(s.task)}</p></div>
    <label class="fld" for="cmd">命令(在练习根目录下执行)</label>
    <textarea id="cmd" spellcheck="false" placeholder="ffmpeg -i assets/... "></textarea>
    <div class="actions">
      <button class="primary" id="btnRun">执行并验证</button>
      <button id="btnHint">显示示例命令</button>
      <span class="meta" id="runMeta"></span>
    </div>
    <div id="hintSlot">${S.lastHint?`<div class="hintbox">${esc(S.lastHint)}</div>`:""}</div>
    <div id="resultSlot"></div>
    ${s.insight?`<div class="insight"><b>这一步的结论</b>${esc(s.insight)}</div>`:""}
    ${s.outputs.length?`<div class="sec">期望产物</div><pre>${s.outputs.map(esc).join("\n")}</pre>`:""}
  `;
  document.getElementById("btnRun").onclick = runStep;
  document.getElementById("btnHint").onclick = ()=>{
    S.lastHint = s.hint || "（本步未附示例，请按任务描述自行编写）";
    document.getElementById("hintSlot").innerHTML = `<div class="hintbox">${esc(S.lastHint)}</div>`;
  };
}

async function runStep(){
  const s = S.state.steps.find(x=>x.id===S.current);
  const cmd = document.getElementById("cmd").value.trim();
  const btn = document.getElementById("btnRun");
  if(!cmd){ alert("请先填写命令"); return; }
  btn.disabled = true; btn.textContent = "执行中…";
  document.getElementById("resultSlot").innerHTML = "";
  try{
    const r = await api("/api/run", {step:s.id, command:cmd});
    const v = r.verdict;
    document.getElementById("runMeta").innerHTML = `退出码 <b>${r.returncode}</b> · 用时已记录`;
    const rows = v.checks.map(c=>`<tr><td class="k">${esc(c.key)}</td>
      <td><span class="${c.ok?"ok":"no"}">${c.ok?"OK":"FAIL"}</span></td>
      <td>${esc(c.detail)}</td></tr>`).join("");
    const log = (r.stderr||r.stdout||"").trim();
    document.getElementById("resultSlot").innerHTML = `
      <div class="verdict ${v.passed?"pass":"fail"}">
        ${v.passed?"通过 —— 这一步的产物符合全部断言":"未通过 —— 见下表失败项"}
      </div>
      <div class="sec">断言明细</div>
      <table><thead><tr><th>检查项</th><th>结果</th><th>实测 / 期望</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="sec">ffmpeg 输出（末尾）</div>
      <pre>${esc(log || "（无输出）")}</pre>`;
    S.state = await api("/api/state");
    renderSteps();
    // 同步顶部进度数字与进度条:只重绘侧栏的话,最后一步通过后主区仍显示旧百分比,
    // 学员会以为没做完(实测 80% 卡住)。
    const passed = S.state.steps.filter(x=>x.status==="passed").length;
    const pct2 = (passed / S.state.steps.length * 100).toFixed(0);
    const metaEl = document.querySelector("main .meta");
    if(metaEl){
      const b = metaEl.querySelector("b");
      if(b) b.textContent = pct2 + "%";
    }
    const barEl = document.querySelector("main .bar i");
    if(barEl) barEl.style.width = pct2 + "%";
    const stEl = [...document.querySelectorAll("main .meta span")].find(x=>x.textContent.includes("状态"));
    if(stEl && v.passed) stEl.innerHTML = "状态 <b>已通过</b>";

    if(r.state && r.state.completed){
      const banner = document.createElement("div");
      banner.className = "done-banner";
      banner.innerHTML = '全部步骤已通过。成片在 <code>workspace/work/final.mp4</code>。';
      document.getElementById("main").prepend(banner);
    }

    // 通过后给出明确的"进入下一步"入口。
    // 不自动跳转:跳转会立刻重绘主区,把刚生成的断言表格冲掉,
    // 学员看不到"哪几条断言通过了"——这与教学目的相反(实测踩到)。
    if(v.passed && r.state && r.state.next_step){
      const bar = document.createElement("div");
      bar.className = "actions";
      const b = document.createElement("button");
      b.className = "primary";
      b.textContent = "进入下一步 · " + r.state.next_step;
      b.onclick = async ()=>{
        S.current = r.state.next_step; S.lastHint = null;
        await refresh();
        document.getElementById("main").scrollTop = 0;
      };
      bar.appendChild(b);
      document.getElementById("resultSlot").prepend(bar);
    }
  }catch(e){
    document.getElementById("resultSlot").innerHTML = `<div class="verdict fail">执行失败:${esc(e.message)}</div>`;
  }finally{
    btn.disabled = false; btn.textContent = "执行并验证";
  }
}

async function refresh(){ S.state = await api("/api/state"); if(!S.current) S.current = S.state.next_step || S.state.steps[0].id; document.getElementById("rootPath").textContent = S.state.root; renderSteps(); renderMain(); }

document.getElementById("btnReset").onclick = async ()=>{
  if(!confirm("清空 work/ 下的全部产物并重置进度，确定？")) return;
  await api("/api/reset",{scope:"work"}); S.lastHint=null; await refresh();
};
document.getElementById("btnResetAll").onclick = async ()=>{
  if(!confirm("删除并重新合成全部素材，同时清空产物与进度，确定？")) return;
  await api("/api/reset",{scope:"all"}); S.lastHint=null; await refresh();
};
document.getElementById("btnResetProgress").onclick = async ()=>{
  if(!confirm("只清空进度记录，产物保留，确定？")) return;
  await api("/api/reset-progress",{}); S.lastHint=null; await refresh();
};
refresh().catch(e=>{ document.getElementById("main").innerHTML = `<div class="verdict fail">无法连接服务:${esc(e.message)}</div>`; });
</script>
</body>
</html>
