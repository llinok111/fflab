<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#1A1A1A; --panel:#262626; --line:#3D3D3D;
    --ink:#F0F0F0; --dim:#CCCCCC; --weak:#999999; --accent:#6495ED;
    --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
    --sans:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:640px;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);position:relative}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:64px 64px;opacity:.16}
  .wrap{position:relative;padding:64px 72px;height:100%;display:flex;flex-direction:column}
  .kicker{font-family:var(--mono);font-size:13px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
  h1{font-size:82px;line-height:1;letter-spacing:-.02em;margin:18px 0 0;font-weight:700}
  h1 span{color:var(--weak);font-weight:300}
  .sub{margin-top:18px;font-size:22px;color:var(--dim);letter-spacing:.01em}
  .rule{height:2px;background:var(--accent);width:76px;margin:30px 0 26px}
  .claims{display:flex;gap:14px}
  .claim{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 18px;min-width:196px}
  .claim b{display:block;font-family:var(--mono);font-size:26px;color:var(--ink);font-weight:600}
  .claim i{display:block;font-style:normal;font-size:12.5px;color:var(--weak);margin-top:5px;letter-spacing:.03em}
  .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;
        font-family:var(--mono);font-size:13px;color:var(--weak)}
  .foot .cmd{color:var(--dim)}
  .foot .cmd em{color:var(--accent);font-style:normal}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="kicker">ffmpeg filtergraph · hands-on lab</div>
    <h1>fflab<span> / 滤镜图练习台</span></h1>
    <div class="sub">每一步都真实执行 ffmpeg，每一条断言都来自产物测量</div>
    <div class="rule"></div>
    <div class="claims">
      <div class="claim"><b>5 步</b><i>规格统一 → 拼接 → 混音 → 合流 → 交付</i></div>
      <div class="claim"><b>27 项</b><i>自动化测试，全部真实执行</i></div>
      <div class="claim"><b>13 项</b><i>界面端到端断言，真实点击</i></div>
    </div>
    <div class="foot">
      <div class="cmd"><em>python -m fflab.cli serve</em> → 127.0.0.1:8765</div>
      <div>github.com/llinok111/fflab</div>
    </div>
  </div>
</body>
</html>
